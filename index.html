<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Typing Survival Game ⌨️</title>

<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
</head>

<body>

<div class="container">

    <h1>⌨️ Typing Survival Game</h1>

    <p id="quote">Click Start to Play 🚀</p>

    <textarea id="input" placeholder="Type here..." disabled></textarea>

    <div class="stats">
        <span>⏱ Time: <b id="time">0</b>s</span>
        <span>🏆 Score: <b id="speed">0</b></span>
        <span>🎯 Accuracy: <b id="accuracy">0</b>%</span>
    </div>

    <button onclick="startGame()">Start</button>
    <button onclick="restartGame()">Restart</button>

</div>

<script src="script.js"></script>
</body>
</html>
